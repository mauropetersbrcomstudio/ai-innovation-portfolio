name: Agent Security Governance Tests

on:
  push:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-security-governance/**"
      - ".github/workflows/agent-security-governance-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-security-governance/**"
      - ".github/workflows/agent-security-governance-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: Demo Templates/AI Skills & Tooling/agent-security-governance
        run: python -m unittest discover -s tests -v
