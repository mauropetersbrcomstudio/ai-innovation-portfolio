name: Durable Workflow Runner Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/durable-workflow-runner/**"
      - "Demo Templates/AI Skills & Tooling/agent-state-store/**"
      - "Demo Templates/AI Skills & Tooling/agent-observability/**"
      - ".github/workflows/durable-workflow-runner-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/durable-workflow-runner/**"
      - "Demo Templates/AI Skills & Tooling/agent-state-store/**"
      - "Demo Templates/AI Skills & Tooling/agent-observability/**"
      - ".github/workflows/durable-workflow-runner-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run durable runner tests
        working-directory: Demo Templates/AI Agents & Agentic Systems/durable-workflow-runner
        run: python -m unittest discover -s tests -v
