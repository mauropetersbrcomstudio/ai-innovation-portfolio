name: Client Case Publication Gate Tests

on:
  push:
    branches: [main]
    paths:
      - "Demo Templates/AI Skills & Tooling/client-case-publication-gate/**"
      - ".github/workflows/client-case-publication-gate-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "Demo Templates/AI Skills & Tooling/client-case-publication-gate/**"
      - ".github/workflows/client-case-publication-gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-gate:
    name: Publication gate unit and sample checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run publication gate tests
        working-directory: "Demo Templates/AI Skills & Tooling/client-case-publication-gate"
        run: python -m unittest discover -s tests -v

      - name: Run intentionally blocked synthetic sample
        working-directory: "Demo Templates/AI Skills & Tooling/client-case-publication-gate"
        run: python publication_gate.py sample_manifest.json
