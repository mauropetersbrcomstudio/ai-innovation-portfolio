name: THL MVP checks

on:
  pull_request:
    paths:
      - "Client Case Studies/thl-intelligent-logistics-operations/**"
      - ".github/workflows/thl-mvp-checks.yml"
  push:
    branches:
      - "feature/thl-intelligent-logistics-mvp"
    paths:
      - "Client Case Studies/thl-intelligent-logistics-operations/**"
      - ".github/workflows/thl-mvp-checks.yml"

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check "Client Case Studies/thl-intelligent-logistics-operations/app.js"

      - name: Check Python syntax
        run: python -m py_compile "Client Case Studies/thl-intelligent-logistics-operations/server.py"

      - name: Validate required application files and UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("Client Case Studies/thl-intelligent-logistics-operations")
          required = ["README.md", "index.html", "styles.css", "app.js", "server.py", "docs/BASELINE-OPERACIONAL.md"]
          missing = [name for name in required if not (root / name).is_file()]
          assert not missing, f"Missing files: {missing}"
          html = (root / "index.html").read_text(encoding="utf-8")
          js = (root / "app.js").read_text(encoding="utf-8")
          for form_id in ["shipment-form", "discovery-form", "occurrence-form", "document-form", "event-form", "pod-form", "collection-form", "terminal-form"]:
              assert f'id="{form_id}"' in html, f"Missing form in HTML: {form_id}"
              assert f'$("{form_id}")' in js, f"Missing JS handler: {form_id}"
          for asset in ["styles.css", "app.js"]:
              assert f'href="{asset}"' in html or f'src="{asset}"' in html, f"Missing asset reference: {asset}"
          assert '127.0.0.1' in (root / "server.py").read_text(encoding="utf-8")
          assert 'id="shipment-reference-options"' in html, "Missing shipment reference datalist"
          assert 'shipment-reference-options' in js, "Missing reference datalist rendering"
          for metric_id in ["metric-collections", "metric-terminal", "metric-events", "metric-pods"]:
              assert f'id="{metric_id}"' in html, f"Missing dashboard metric: {metric_id}"
              assert f'$("{metric_id}")' in js, f"Missing dashboard binding: {metric_id}"
          assert 'id="modality-summary"' in html and 'modality-summary' in js, "Missing modality summary"
          assert 'id="metric-overdue"' in html and 'metric-overdue' in js, "Missing overdue forecast indicator"
          assert 'Entrega realizada' in js and 'Em ocorrência' in js, "Missing shipment lifecycle mapping"
          assert 'Conferido manualmente' in js and 'Concluída' in js, "Missing POD completion mapping"
          assert 'Pronto para expedição' in js and 'Em transferência' in js, "Missing terminal lifecycle mapping"
          for alert_token in ["operationalAlerts", "renderOperationalAlerts", "Previsão informada ultrapassada", "Ocorrência prioritária em aberto", "Conferência de coleta requer revisão", "Divergência registrada no terminal", "Comprovante divergente", "Documento requer acompanhamento"]:
              assert alert_token in js, f"Missing operational alert rule: {alert_token}"
          for alert_id in ["operational-alert-count", "operational-alerts"]:
              assert f'id="{alert_id}"' in html, f"Missing operational alert UI: {alert_id}"
              assert alert_id in js, f"Missing operational alert binding: {alert_id}"



          print("THL MVP static checks passed.")
          PY
