name: Brief-to-Task Demo Tests

on:
  push:
    paths:
      - "Demo Templates/AI Skills & Tooling/brief-to-task/**"
      - ".github/workflows/brief-to-task-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Skills & Tooling/brief-to-task/**"
      - ".github/workflows/brief-to-task-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: Demo Templates/AI Skills & Tooling/brief-to-task
        run: python -m unittest discover -s tests -v
      - name: Run sample
        working-directory: Demo Templates/AI Skills & Tooling/brief-to-task
        run: python skill.py --input sample_brief.json --output-dir output
