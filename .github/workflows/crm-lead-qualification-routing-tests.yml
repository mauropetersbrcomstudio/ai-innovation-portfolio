name: CRM Lead Qualification & Routing Tests

on:
  push:
    paths:
      - "Demo Templates/AI Automation & Workflows/crm-lead-qualification-routing/**"
      - ".github/workflows/crm-lead-qualification-routing-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Automation & Workflows/crm-lead-qualification-routing/**"
      - ".github/workflows/crm-lead-qualification-routing-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Demo Templates/AI Automation & Workflows/crm-lead-qualification-routing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute sample workflow
        run: python crm_router.py --leads sample_leads.csv --rules routing_rules.json --output-dir output
