name: Agent Runtime Control Plane Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/agent-runtime-control-plane/**"
      - ".github/workflows/agent-runtime-control-plane-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/agent-runtime-control-plane/**"
      - ".github/workflows/agent-runtime-control-plane-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run runtime control plane tests
        working-directory: Demo Templates/AI Agents & Agentic Systems/agent-runtime-control-plane
        run: python -m unittest discover -s tests -v
