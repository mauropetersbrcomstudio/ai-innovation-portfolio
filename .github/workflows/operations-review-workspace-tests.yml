name: Operations Review Workspace Tests
on:
  push:
    paths:
      - "Demo Templates/AI Product Development/operations-review-workspace/**"
      - "Demo Templates/AI Automation & Workflows/intake-operations-hub/**"
      - "Demo Templates/AI Agents & Agentic Systems/durable-workflow-runner/**"
      - "Demo Templates/AI Skills & Tooling/agent-state-store/**"
  pull_request:
    paths:
      - "Demo Templates/AI Product Development/operations-review-workspace/**"
      - "Demo Templates/AI Automation & Workflows/intake-operations-hub/**"
      - "Demo Templates/AI Agents & Agentic Systems/durable-workflow-runner/**"
      - "Demo Templates/AI Skills & Tooling/agent-state-store/**"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run workspace integration tests
        working-directory: Demo Templates/AI Product Development/operations-review-workspace
        run: python -m unittest discover -s tests -v
