name: Procurement Request Triage Agent Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/sme-procurement-request-triage/**"
      - ".github/workflows/procurement-request-triage-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/sme-procurement-request-triage/**"
      - ".github/workflows/procurement-request-triage-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Demo Templates/AI Agents & Agentic Systems/sme-procurement-request-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run sample demonstration
        run: python procurement_agent.py
