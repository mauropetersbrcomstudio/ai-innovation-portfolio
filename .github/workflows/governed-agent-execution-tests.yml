name: Governed Agent Execution Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/governed-agent-execution/**"
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - "Demo Templates/AI Skills & Tooling/agent-policy-validator/**"
      - "Demo Templates/AI Skills & Tooling/agent-security-governance/**"
      - "Demo Templates/AI Skills & Tooling/agent-tool-gateway/**"
      - ".github/workflows/governed-agent-execution-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/governed-agent-execution/**"
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - "Demo Templates/AI Skills & Tooling/agent-policy-validator/**"
      - "Demo Templates/AI Skills & Tooling/agent-security-governance/**"
      - "Demo Templates/AI Skills & Tooling/agent-tool-gateway/**"
      - ".github/workflows/governed-agent-execution-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run governed execution tests
        working-directory: Demo Templates/AI Agents & Agentic Systems/governed-agent-execution
        run: python -m unittest discover -s tests -v
