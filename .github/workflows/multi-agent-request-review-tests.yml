name: Multi-Agent Request Review Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/multi-agent-request-review/**"
      - "Demo Templates/AI Skills & Tooling/agent-coordination/**"
      - ".github/workflows/multi-agent-request-review-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/multi-agent-request-review/**"
      - "Demo Templates/AI Skills & Tooling/agent-coordination/**"
      - ".github/workflows/multi-agent-request-review-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run integration tests
        working-directory: Demo Templates/AI Agents & Agentic Systems/multi-agent-request-review
        run: python -m unittest discover -s tests -v
