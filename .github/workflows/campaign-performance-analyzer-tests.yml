name: Campaign Performance Analyzer Tests

on:
  push:
    paths:
      - "Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - ".github/workflows/campaign-performance-analyzer-tests.yml"
  pull_request:
    paths:
      - "Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - ".github/workflows/campaign-performance-analyzer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python analyzer tests
        working-directory: Marketing Intelligence & Business Automation/campaign-performance-analyzer
        run: python -m unittest discover -s tests -v
  browser-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run browser dashboard logic tests
        working-directory: Marketing Intelligence & Business Automation/campaign-performance-analyzer
        run: node --test tests/dashboard-logic.test.js
