name: Marketing Analytics Pipeline Tests

on:
  push:
    paths:
      - "Demo Templates/Marketing Intelligence & Business Automation/marketing-analytics-pipeline/**"
      - "Demo Templates/Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - "Demo Templates/AI Skills & Tooling/csv-data-quality/**"
      - ".github/workflows/marketing-analytics-pipeline-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/Marketing Intelligence & Business Automation/marketing-analytics-pipeline/**"
      - "Demo Templates/Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - "Demo Templates/AI Skills & Tooling/csv-data-quality/**"
      - ".github/workflows/marketing-analytics-pipeline-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline integration tests
        working-directory: Demo Templates/Marketing Intelligence & Business Automation/marketing-analytics-pipeline
        run: python -m unittest discover -s tests -v
