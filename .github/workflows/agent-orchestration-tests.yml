name: Agent Orchestration Tests

on:
  push:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - ".github/workflows/agent-orchestration-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - ".github/workflows/agent-orchestration-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: Demo Templates/AI Skills & Tooling/agent-orchestration
        run: python -m unittest discover -s tests -v
