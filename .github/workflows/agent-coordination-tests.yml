name: Agent Coordination Tests

on:
  push:
    paths:
      - "AI Skills & Tooling/agent-coordination/**"
      - ".github/workflows/agent-coordination-tests.yml"
  pull_request:
    paths:
      - "AI Skills & Tooling/agent-coordination/**"
      - ".github/workflows/agent-coordination-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: AI Skills & Tooling/agent-coordination
        run: python -m unittest discover -s tests -v
