name: Agent Evaluation Tests

on:
  push:
    paths:
      - "AI Skills & Tooling/agent-evaluation/**"
      - ".github/workflows/agent-evaluation-tests.yml"
  pull_request:
    paths:
      - "AI Skills & Tooling/agent-evaluation/**"
      - ".github/workflows/agent-evaluation-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: AI Skills & Tooling/agent-evaluation
        run: python -m unittest discover -s tests -v
      - name: Run sample evaluation
        working-directory: AI Skills & Tooling/agent-evaluation
        run: python evaluate.py --actual examples/actual.json --expectations examples/expectations.json
