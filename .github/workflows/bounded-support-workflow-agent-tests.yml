name: Bounded Support Workflow Agent Tests

on:
  push:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/bounded-support-workflow-agent/**"
      - "Demo Templates/AI Skills & Tooling/agent-tool-gateway/**"
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - ".github/workflows/bounded-support-workflow-agent-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Agents & Agentic Systems/bounded-support-workflow-agent/**"
      - "Demo Templates/AI Skills & Tooling/agent-tool-gateway/**"
      - "Demo Templates/AI Skills & Tooling/agent-orchestration/**"
      - ".github/workflows/bounded-support-workflow-agent-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run integration tests
        working-directory: Demo Templates/AI Agents & Agentic Systems/bounded-support-workflow-agent
        run: python -m unittest discover -s tests -v
