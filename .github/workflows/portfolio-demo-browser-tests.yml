name: Portfolio Demo Browser Tests

on:
  push:
    paths:
      - "AI Product Development/operations-review-workspace/**"
      - "Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - "tests/portfolio-demos.e2e.mjs"
      - ".github/workflows/portfolio-demo-browser-tests.yml"
  pull_request:
    paths:
      - "AI Product Development/operations-review-workspace/**"
      - "Marketing Intelligence & Business Automation/campaign-performance-analyzer/**"
      - "tests/portfolio-demos.e2e.mjs"
      - ".github/workflows/portfolio-demo-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local demo servers
        run: |
          python "AI Product Development/operations-review-workspace/server.py" --database /tmp/portfolio-e2e.sqlite --events /tmp/portfolio-e2e.jsonl --port 8765 > /tmp/workspace.log 2>&1 &
          python -m http.server 8766 --directory "Marketing Intelligence & Business Automation/campaign-performance-analyzer" > /tmp/dashboard.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health && curl -fsS http://127.0.0.1:8766/dashboard.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/api/health
      - name: Run end-to-end browser checks
        run: node tests/portfolio-demos.e2e.mjs
