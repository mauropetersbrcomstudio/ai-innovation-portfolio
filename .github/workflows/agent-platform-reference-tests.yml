name: Agent Platform Reference Tests

on:
  push:
    paths:
      - "AI Agents & Agentic Systems/agent-platform-reference/**"
      - "AI Skills & Tooling/agent-orchestration/**"
      - "AI Skills & Tooling/agent-state-store/**"
      - "AI Skills & Tooling/agent-observability/**"
      - ".github/workflows/agent-platform-reference-tests.yml"
  pull_request:
    paths:
      - "AI Agents & Agentic Systems/agent-platform-reference/**"
      - "AI Skills & Tooling/agent-orchestration/**"
      - "AI Skills & Tooling/agent-state-store/**"
      - "AI Skills & Tooling/agent-observability/**"
      - ".github/workflows/agent-platform-reference-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run integration tests
        working-directory: AI Agents & Agentic Systems/agent-platform-reference
        run: python -m unittest discover -s tests -v
