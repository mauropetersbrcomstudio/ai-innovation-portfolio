name: SME KPI Workspace Tests

on:
  push:
    paths:
      - "Web Applications & SaaS/sme-kpi-workspace/**"
      - ".github/workflows/sme-kpi-workspace-tests.yml"
  pull_request:
    paths:
      - "Web Applications & SaaS/sme-kpi-workspace/**"
      - ".github/workflows/sme-kpi-workspace-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run KPI calculation tests
        working-directory: Web Applications & SaaS/sme-kpi-workspace
        run: npm test
