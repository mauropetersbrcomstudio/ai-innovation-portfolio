name: Publish THL dashboard

on:
  push:
    branches:
      - main
    paths:
      - "Client Case Studies/thl-intelligent-logistics-operations/**"
      - ".github/workflows/publish-thl-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-thl"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Client Case Studies/thl-intelligent-logistics-operations"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
