name: Agent Policy Validator Tests

on:
  push:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-policy-validator/**"
      - ".github/workflows/agent-policy-validator-tests.yml"
  pull_request:
    paths:
      - "Demo Templates/AI Skills & Tooling/agent-policy-validator/**"
      - ".github/workflows/agent-policy-validator-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: Demo Templates/AI Skills & Tooling/agent-policy-validator
        run: python -m unittest discover -s tests -v
      - name: Validate sample policy
        working-directory: Demo Templates/AI Skills & Tooling/agent-policy-validator
        run: python validate_policy.py examples/policy.json
